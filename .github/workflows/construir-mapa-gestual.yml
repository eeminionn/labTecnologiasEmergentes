name: Construir Mapa Gestual MLR

on:
  push:
    branches: [main, codex/mapa-gestual-prototipo]
    paths:
      - 'mapaGestualMLR/src/**'
      - 'mapaGestualMLR/electron/**'
      - 'mapaGestualMLR/scripts/**'
      - 'mapaGestualMLR/tests/**'
      - 'mapaGestualMLR/assets/**'
      - 'mapaGestualMLR/package*.json'
      - 'mapaGestualMLR/index.html'
      - 'mapaGestualMLR/vite.config.js'
      - 'mapaGestualMLR/THIRD_PARTY_NOTICES.md'
      - '.github/workflows/construir-mapa-gestual.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: mapaGestualMLR
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mapaGestualMLR/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run test:app
      - run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verificar la aplicación empaquetada
        shell: pwsh
        run: |
          $reportPath = Join-Path $env:RUNNER_TEMP 'mapa-gestual-smoke.json'
          $process = Start-Process -FilePath '.\release\win-unpacked\Mapa Gestual MLR.exe' -ArgumentList @('--smoke', "--smoke-report=$reportPath") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Smoke empaquetado falló: $($process.ExitCode)" }
          $report = Get-Content $reportPath -Raw | ConvertFrom-Json
          if (!$report.ok) { throw 'Smoke empaquetado no confirmó el modelo local' }
          Copy-Item $reportPath '.\release\verificacion-windows.json'
      - uses: actions/upload-artifact@v4
        with:
          name: MapaGestualMLR-windows-x64
          path: |
            mapaGestualMLR/release/*.exe
            mapaGestualMLR/release/verificacion-windows.json
          retention-days: 30
